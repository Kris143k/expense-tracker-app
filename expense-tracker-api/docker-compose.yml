services:

  db:
    image: postgres

    environment:
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: expense_tracker

    ports:
      - "5432:5432"

  api:
    build: .

    ports:
      - "8000:8000"

    depends_on:
      - db

    environment:
      DATABASE_URL: postgresql://postgres:1234@db:5432/expense_tracker